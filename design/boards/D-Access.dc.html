<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ד · נגישות</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{accent}}; color: #1E1633; font-family: 'Assistant', system-ui, sans-serif; font-size: 16px; overflow: hidden;">

<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

<header style="display: flex; align-items: center; gap: 12px;">
<button type="button" aria-label="חזרה להגדרות" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 2px solid #1E1633; background: #FFFFFF; color: #1E1633; box-shadow: 0 3px 0 #1E1633; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<h1 style="margin: 0; font-family: 'Secular One', sans-serif; font-size: 30px; line-height: 1.05; font-weight: 400;">נגישות</h1>
</header>

<p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.35;">ההתאמות נשמרות בפרופיל שלך ופועלות בכל החברויות. הן באות בנוסף להגדרות של הטלפון.</p>

<section aria-label="גודל טקסט" style="background: #FFFFFF; border: 2px solid #1E1633; border-radius: 18px; box-shadow: 0 3px 0 #1E1633; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<span style="font-weight: 800; font-size: 17px;">גודל טקסט</span>
<div role="radiogroup" aria-label="גודל טקסט" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
<span role="radio" aria-checked="{{z.checked}}" style="min-height: 48px; box-sizing: border-box; border-radius: 24px; border: 2px solid #1E1633; background: {{z.bg}}; color: {{z.fg}}; font-weight: 800; font-size: {{z.px}}px; display: flex; align-items: center; justify-content: center;">{{z.label}}</span>
</sc-for>
</div>
<div style="padding: 8px 12px; border-radius: 14px; background: #FFF9EC; border: 2px dashed #1E1633; font-size: 18px; font-weight: 700;">כך ייראה הטקסט באפליקציה.</div>
</section>

<section aria-label="תצוגה" style="background: #FFFFFF; border: 2px solid #1E1633; border-radius: 18px; box-shadow: 0 3px 0 #1E1633; display: flex; flex-direction: column;">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="min-height: 64px; box-sizing: border-box; padding: 8px 14px; display: flex; align-items: center; gap: 12px; border-bottom: {{t.line}};">
<div style="flex: 1; display: flex; flex-direction: column;">
<span style="font-weight: 800; font-size: 17px;">{{t.label}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5A4E70;">{{t.sub}}</span>
</div>
<span style="display:inline-flex;align-items:center;min-height:44px;flex-shrink:0;"><span role="switch" aria-checked="{{t.on}}" style="width: 52px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 15px; border: 2px solid #1E1633; background: {{t.bg}}; position: relative;"><span style="position: absolute; top: 2px; {{t.pos}} width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 2px solid #1E1633; box-sizing: border-box;"></span></span></span>
</div>
</sc-for>
</section>

<section aria-label="עזרה והצהרה" style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{links}}" as="l" hint-placeholder-count="3">
<a href="#" style="min-height: 56px; box-sizing: border-box; padding: 8px 14px; background: #FFFFFF; border: 2px solid #1E1633; border-radius: 18px; box-shadow: 0 3px 0 #1E1633; display: flex; align-items: center; gap: 12px;">
<div style="flex: 1; display: flex; flex-direction: column;">
<span style="font-weight: 800; font-size: 16px;">{{l.label}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5A4E70;">{{l.sub}}</span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
</sc-for>
</section>
</div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD84A","options":["#FFD84A","#5EE0C0","#FF9B6B","#B9A4FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFD84A';
    const sizes = [
      { label: 'רגיל', px: 15, checked: false },
      { label: 'גדול', px: 18, checked: true },
      { label: 'גדול מאוד', px: 20, checked: false }
    ].map(z => ({ ...z, bg: z.checked ? '#1E1633' : '#FFFFFF', fg: z.checked ? '#FFFFFF' : '#1E1633' }));
    const T = (label, sub, on) => ({ label, sub, on, bg: on ? '#00B67A' : '#B8AFC7', pos: on ? 'inset-inline-end: 2px;' : 'inset-inline-start: 2px;', line: '1.5px solid #EDE6D6' });
    const toggles = [
      T('ניגודיות גבוהה', 'טקסט כהה יותר וקווי מתאר עבים', true),
      T('הפחתת תנועה', 'בלי אנימציות והחלקות', false),
      { ...T('הדגשת מיקוד', 'מסגרת עבה סביב הרכיב הנבחר במקלדת', true), line: 'none' }
    ];
    const links = [
      { label: 'הצהרת נגישות', sub: 'מה נגיש, מה עדיין לא, ומה החלופה' },
      { label: 'דיווח על בעיית נגישות', sub: 'כתבו לנו ונחזור אליכם' },
      { label: 'פנייה לרכז הנגישות', sub: 'טלפון ומייל' }
    ];
    const tabs = [
      { label: 'דורש טיפול', icon: 'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0' },
      { label: 'ארנק', active: true, icon: 'M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2' },
      { label: 'גילוי', icon: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3' }
    ].map(t => ({ ...t, bg: t.active ? accent : 'transparent', border: t.active ? '#1E1633' : 'transparent' }));
    return { accent, sizes, toggles, links, tabs };
  }
}
</script>
</body>
</html>
