<g transform="translate(344 372) rotate(-10) scale(1.4)"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"></path></g>
<g transform="translate(340 66) rotate(20)"><rect width="14" height="6" rx="2"></rect></g>
<g transform="translate(26 84) rotate(-24)"><rect width="14" height="6" rx="2"></rect></g>
<g transform="translate(364 130)"><path d="M0 -7v14M-7 0h14"></path></g>
<g transform="translate(30 270)"><path d="M0 -6v12M-6 0h12"></path></g>
<g transform="translate(18 760) rotate(-12) scale(1.6)"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path></g>
<g transform="translate(346 770) rotate(10) scale(1.5)"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></g>

<svg width="390" height="110" viewBox="0 0 390 110" style="position: absolute; top: 0; left: 0;" aria-hidden="true">
<polygon points="78,-2 122,-2 211,88 181,98" fill="var(--org)" stroke="#1E1633" stroke-width="2.5" stroke-linejoin="round"></polygon>

<polygon points="268,-2 312,-2 209,98 179,88" fill="var(--org)" stroke="#1E1633" stroke-width="2.5" stroke-linejoin="round"></polygon>
<line x1="290" y1="0" x2="194" y2="92" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="5 5"></line>
<rect x="175" y="78" width="40" height="28" rx="9" fill="#FFFFFF" stroke="#1E1633" stroke-width="2.5"></rect>
</svg>

<button type="button" aria-label="חזרה לארנק" style="position: absolute; top: 14px; inset-inline-start: 14px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #1E1633; background: #FFFFFF; color: #1E1633; box-shadow: 0 3px 0 #1E1633; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<article style="position: relative; margin-top: 84px; width: 308px; height: 340px; box-sizing: border-box; border: 2.5px solid #1E1633; border-radius: 28px; background: #FFF9EC; overflow: hidden; box-shadow: 0 4px 0 #1E1633;">

<div style="position: relative; height: 158px; box-sizing: border-box; padding: 22px 20px 0; background: var(--org); color: var(--on); border-bottom: 2.5px solid #1E1633; border-bottom-left-radius: 50% 26px; border-bottom-right-radius: 50% 26px; display: flex; flex-direction: column; align-items: center; overflow: hidden;">
<span style="position: absolute; top: -70px; right: -50px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.16);"></span>
<span style="position: absolute; bottom: -60px; left: -40px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.12);"></span>
<div style="position: relative; margin-top: 10px; width: 62px; height: 62px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; color: #1E1633; border: 2.5px solid #1E1633; display: flex; align-items: center; justify-content: center; font-family: 'Secular One', sans-serif; font-size: 32px;">{{letter}}</div>
<h1 style="position: relative; margin: 8px 0 0; font-family: 'Secular One', sans-serif; font-size: 22px; line-height: 1.1; font-weight: 400; text-align: center;">{{orgName}}</h1>
<span style="position: relative; margin-top: 6px; transform: rotate(-2deg); padding: 1px 14px; background: #FFD84A; color: #1E1633; border: 2px solid #1E1633; border-radius: 10px; font-size: 14px; font-weight: 800;">{{role}}</span>
<button type="button" aria-label="הפוך את הכרטיס לקוד כניסה" style="position: absolute; top: 10px; inset-inline-end: 12px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 2px solid #1E1633; background: #FFFFFF; color: #1E1633; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v7h-3"></path></svg>
</button>
</div>

<div style="position: absolute; top: 128px; inset-inline-end: 14px; width: 66px; height: 66px; box-sizing: border-box; border-radius: 50%; background: #FF5A36; color: #1E1633; border: 2.5px solid #1E1633; box-shadow: 0 3px 0 #1E1633; transform: rotate(10deg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2;">
<span style="font-size: 11px; font-weight: 800;">{{sinceWord}}</span>
<span style="font-family: 'Secular One', sans-serif; font-size: 23px; line-height: 1;">{{sinceYear}}</span>
</div>

<div style="box-sizing: border-box; padding: 16px 20px 0; text-align: center;">
<div style="font-family: 'Secular One', sans-serif; font-size: 34px; line-height: 1.05;">{{memberName}}</div>
<div style="margin-top: 2px; font-size: 13px; color: #5A4E70; font-weight: 700;">{{joined}}</div>
</div>

<div style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;">
<div style="display: flex;">
<sc-for list="{{crowd}}" as="p" hint-placeholder-count="4">
<span style="width: 24px; height: 24px; box-sizing: border-box; margin-inline-start: -7px; border-radius: 50%; background: {{p.c}}; border: 2px solid #1E1633;"></span>
</sc-for>
</div>
<span style="font-size: 13px; font-weight: 800;">{{crowdText}}</span>
</div>

<div style="position: absolute; left: 22px; right: 22px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between;">
<div style="display: flex; flex-direction: column;">
<span style="font-size: 11px; color: #5A4E70; font-weight: 700;">מספר חבר</span>
<span style="font-family: 'Secular One', sans-serif; font-size: 26px; line-height: 1;">{{number}}</span>
</div>
<div style="display: flex; flex-direction: column; text-align: end;">
<span style="font-size: 11px; color: #5A4E70; font-weight: 700;">{{nextLabel}}</span>
<span style="font-family: 'Secular One', sans-serif; font-size: 26px; line-height: 1;">{{nextValue}}</span>
</div>
</div>
</article>

<div style="position: relative; margin-top: 12px; width: 358px; box-sizing: border-box; min-height: 48px; padding: 6px 12px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid #1E1633; border-radius: 16px; box-shadow: 0 3px 0 #1E1633;">
<span style="position: relative; width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%; background: #FF5A36; color: #1E1633; border: 2px solid #1E1633; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
</span>
<span style="flex: 1; font-size: 15px; font-weight: 800; line-height: 1.2;">{{notice}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</div>

<section style="position: relative; margin-top: 12px; width: 358px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<a href="#" style="min-height: 80px; box-sizing: border-box; padding: 12px; background: #FFFFFF; border: 2px solid #1E1633; border-radius: 18px; box-shadow: 0 3px 0 #1E1633; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="width: 38px; height: 38px; box-sizing: border-box; border-radius: 12px; background: {{t.tint}}; border: 2px solid #1E1633; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</div>
<div style="display: flex; flex-direction: column;">
<span style="font-size: 17px; font-weight: 800; line-height: 1.15;">{{t.label}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5A4E70;">{{t.sub}}</span>
</div>
</a>
</sc-for>
</section>

<div style="position: absolute; left: 16px; right: 16px; bottom: 76px;">
<button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: 2.5px solid #1E1633; background: #1E1633; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 800; box-shadow: 0 3px 0 rgba(30,22,51,0.35); cursor: pointer;">{{cta}}</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"org":{"editor":"color","default":"#5B3DF5","options":["#5B3DF5","#FF5A36","#00B67A","#FF5C9E"]},"accent":{"editor":"color","default":"#FFD84A","options":["#FFD84A","#5EE0C0","#FF9B6B","#B9A4FF"]},"$preview":{"width":390,"height":844}}'>
function pickOn(hex) {
  const f = (h) => { const n = parseInt(h.slice(1), 16); return [16, 8, 0].map(s => { const c = ((n >> s) & 255) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); };
  const L = (h) => { const [r, g, b] = f(h); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const cr = (a, b) => (Math.max(L(a), L(b)) + 0.05) / (Math.min(L(a), L(b)) + 0.05);
  return cr('#1E1633', hex) >= cr('#FFFFFF', hex) ? '#1E1633' : '#FFFFFF';
}
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFD84A';
    const org = this.props.org ?? '#5B3DF5';
    const n = parseInt(org.slice(1), 16);
    const lum = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
    const tiles = [
      { label: 'כספים', sub: '₪600 לתשלום', icon: 'M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2', tint: '#FFD84A' },
      { label: 'תפילות ואירועים', sub: 'הפטרה פנויה לשבת', icon: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z', tint: '#E3DDFF' },
      { label: 'פניות והודעות', sub: '2 הודעות חדשות', icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', tint: '#FFD9E8' },
      { label: 'החברות שלי', sub: 'פרטים, הרשאות ופרטיות', icon: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z', tint: '#D5F5E8' }
    ];
    const crowd = ['#FF5A36', '#00B67A', '#FF5C9E', '#18B8F0'].map(c => ({ c }));
    return {
      accent, org, onOrg: pickOn(org) /*contrast-based*/, crowd, tiles,
      letter: 'א', orgName: 'בית הכנסת אור חדש', role: 'חברת קהילה', memberName: 'דנה לוי',
      sinceWord: 'חברות מאז', sinceYear: '2019', joined: 'הצטרפות ב-12.03.2019',
      crowdText: 'אחת מ-312 חברים', number: '0418', nextLabel: 'התשלום הבא', nextValue: '15.11',
      cta: 'לתשלום ₪600',
      notice: 'חיוב אוקטובר ממתין · ₪600'
    };
  }
}
</script>
</body>
</html>
