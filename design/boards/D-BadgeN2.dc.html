<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ד · כרטיס חברות · נקי אופקי (ניסוי)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="--accent: {{accent}}; --org: {{org}}; --on: {{onOrg}}; position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background: {{accent}}; color: #1E1633; font-family: 'Assistant', system-ui, sans-serif; font-size: 16px; font-variant-numeric: tabular-nums; overflow: hidden;">

<button type="button" aria-label="חזרה לארנק" style="position: absolute; top: 14px; inset-inline-start: 14px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #1E1633; background: #FFFFFF; color: #1E1633; box-shadow: 0 3px 0 #1E1633; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<article style="position: relative; margin-top: 70px; width: 358px; height: 214px; box-sizing: border-box; border: 2.5px solid #1E1633; border-radius: 24px; background: var(--org); color: var(--on); overflow: hidden; box-shadow: 0 4px 0 #1E1633; padding: 16px 18px; display: flex; flex-direction: column;">
<span style="position: absolute; top: -90px; left: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,0.14);"></span>
<span style="position: absolute; bottom: -70px; right: -40px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.10);"></span>
<div style="position: relative; display: flex; align-items: center; gap: 12px;">
<div style="width: 54px; height: 54px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; color: #1E1633; border: 2.5px solid #1E1633; display: flex; align-items: center; justify-content: center; font-family: 'Secular One', sans-serif; font-size: 28px;">{{letter}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
<span style="font-family: 'Secular One', sans-serif; font-size: 21px; line-height: 1.1;">{{orgName}}</span>
<span style="align-self: flex-start; padding: 1px 12px; background: #FFD84A; color: #1E1633; border: 2px solid #1E1633; border-radius: 999px; font-size: 13.5px; font-weight: 800;">{{role}}</span>
</div>
<button type="button" aria-label="הפוך את הכרטיס לקוד כניסה" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 2px solid #1E1633; background: #FFFFFF; color: #1E1633; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v7h-3"></path></svg>
</button>
</div>
<div style="position: relative; margin-top: auto; display: flex; flex-direction: column; gap: 2px;">
<span style="font-family: 'Secular One', sans-serif; font-size: 34px; line-height: 1.05;">{{memberName}}</span>
<span style="font-size: 13px; font-weight: 700; opacity: 0.95;">{{joined}}</span>
</div>
<div style="position: relative; margin-top: 12px; padding-top: 10px; border-top: 2px solid rgba(30,22,51,0.35); display: flex; align-items: flex-end; justify-content: space-between;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 700;">מספר חבר</span><span style="font-family: 'Secular One', sans-serif; font-size: 24px; line-height: 1;">{{number}}</span></div>
<div style="display: flex; flex-direction: column; text-align: end;"><span style="font-size: 12px; font-weight: 700;">{{nextLabel}}</span><span style="font-family: 'Secular One', sans-serif; font-size: 24px; line-height: 1;">{{nextValue}}</span></div>
</div>
</article>

<div style="position: relative; margin-top: 12px; width: 358px; box-sizing: border-box; min-height: 48px; padding: 6px 12px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid #1E1633; border-radius: 16px; box-shadow: 0 3px 0 #1E1633;">
<span style="position: relative; width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%; background: #FF5A36; color: #1E1633; border: 2px solid #1E1633; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
</span>
<span style="flex: 1; font-size: 15px; font-weight: 800; line-height: 1.2;">{{notice}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</div>

<section style="position: relative; margin-top: 12px; width: 358px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<a href="#" style="min-height: 80px; box-sizing: border-box; padding: 12px; background: #FFFFFF; border: 2px solid #1E1633; border-radius: 18px; box-shadow: 0 3px 0 #1E1633; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="width: 38px; height: 38px; box-sizing: border-box; border-radius: 12px; background: {{t.tint}}; border: 2px solid #1E1633; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1633" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</div>
<div style="display: flex; flex-direction: column;">
<span style="font-size: 17px; font-weight: 800; line-height: 1.15;">{{t.label}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5A4E70;">{{t.sub}}</span>
</div>
</a>
</sc-for>
</section>

<div style="position: absolute; left: 16px; right: 16px; bottom: 76px;">
<button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: 2.5px solid #1E1633; background: #1E1633; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 800; box-shadow: 0 3px 0 rgba(30,22,51,0.35); cursor: pointer;">{{cta}}</button>
</div>
<nav aria-label="ניווט ראשי" style="position: absolute; inset-inline: 0; bottom: 0; flex-shrink: 0; height: 64px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #FFFFFF; border-top: 2px solid #1E1633; padding: 7px 14px 7px;">
<a href="#" aria-label="הודעות" style="display: flex; align-items: center; justify-content: center; position: relative; min-height: 48px; box-sizing: border-box; border-radius: 24px; border: 2px solid transparent; color: #1E1633;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 2px; inset-inline-end: calc(50% - 26px); min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; border-radius: 9px; background: #FF5A36; color: #1E1633; border: 2px solid #1E1633; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">2</span>
</a>
<a href="#" aria-label="ארנק" aria-current="page" style="display: flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; border-radius: 24px; border: 2px solid #1E1633; background: {{accent}}; color: #1E1633;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2"></path></svg>
<span style="font-weight: 800; font-size: 14px; margin-inline-start: 6px;">ארנק</span></a>
<a href="#" aria-label="חיפוש" style="display: flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; border-radius: 24px; border: 2px solid transparent; color: #1E1633;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"org":{"editor":"color","default":"#5B3DF5","options":["#5B3DF5","#FF5A36","#00B67A","#FF5C9E"]},"accent":{"editor":"color","default":"#FFD84A","options":["#FFD84A","#5EE0C0","#FF9B6B","#B9A4FF"]},"$preview":{"width":390,"height":844}}'>
function pickOn(hex) {
  const f = (h) => { const n = parseInt(h.slice(1), 16); return [16, 8, 0].map(s => { const c = ((n >> s) & 255) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); };
  const L = (h) => { const [r, g, b] = f(h); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const cr = (a, b) => (Math.max(L(a), L(b)) + 0.05) / (Math.min(L(a), L(b)) + 0.05);
  return cr('#1E1633', hex) >= cr('#FFFFFF', hex) ? '#1E1633' : '#FFFFFF';
}
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFD84A';
    const org = this.props.org ?? '#5B3DF5';
    const n = parseInt(org.slice(1), 16);
    const lum = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
    const tiles = [
      { label: 'כספים', sub: '₪600 לתשלום', icon: 'M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2', tint: '#FFD84A' },
      { label: 'תפילות ואירועים', sub: 'הפטרה פנויה לשבת', icon: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z', tint: '#E3DDFF' },
      { label: 'פניות והודעות', sub: '2 הודעות חדשות', icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', tint: '#FFD9E8' },
      { label: 'החברות שלי', sub: 'פרטים, הרשאות ופרטיות', icon: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z', tint: '#D5F5E8' }
    ];
    const crowd = ['#FF5A36', '#00B67A', '#FF5C9E', '#18B8F0'].map(c => ({ c }));
    return {
      accent, org, onOrg: pickOn(org) /*contrast-based*/, crowd, tiles,
      letter: 'א', orgName: 'בית הכנסת אור חדש', role: 'חברת קהילה', memberName: 'דנה לוי',
      sinceWord: 'חברה מאז', sinceYear: '2019', joined: 'הצטרפה ב-12.03.2019',
      crowdText: 'אחת מ-312 חברים', number: '0418', nextLabel: 'התשלום הבא', nextValue: '15.11',
      cta: 'לתשלום ₪600',
      notice: 'חיוב אוקטובר ממתין · ₪600'
    };
  }
}
</script>
</body>
</html>
